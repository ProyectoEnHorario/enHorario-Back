spring:
  application:
    name: enhorario-backend

  sql:
    init:
      mode: always
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enhorario}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-at-least-256-bits}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.enhorario: DEBUG
